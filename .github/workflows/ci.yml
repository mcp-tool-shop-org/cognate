name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - run: pnpm install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Dependency vulnerability scan
        run: |
          set +e
          audit_out="$(pnpm audit --prod --audit-level=high 2>&1)"
          status=$?
          echo "$audit_out"
          if [ "$status" -eq 0 ]; then
            echo "No high or critical vulnerabilities found."
            exit 0
          fi
          if echo "$audit_out" | grep -qiE 'vulnerabilit'; then
            echo "::error::High or critical dependency vulnerabilities detected."
            exit 1
          fi
          echo "::warning::pnpm audit could not reach the advisory registry; treating as non-blocking."
          exit 0
