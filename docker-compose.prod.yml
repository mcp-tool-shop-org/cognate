# Docker Compose — Cognate AI Governance Stack (Production)
#
# Services:
#   caddy        — Reverse proxy with auto-TLS (Let's Encrypt)
#   cognate-node — AI governance REST API
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# Requires:
#   - DOMAIN environment variable set (e.g., export DOMAIN=governance.example.com)
#   - Caddy data directory persisted on host

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=localhost
    depends_on:
      - cognate-node

  cognate-node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NODE_ENV: "production"
      COGNATE_PROMPT_STORE_PATH: "/app/data/prompts"
      COGNATE_AGENT_REGISTRY_PATH: "/app/data/agents"
    volumes:
      - cognate-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  cognate-data:
    driver: local
