# Docker Compose — Cognate AI Governance Stack
#
# LOCAL DEVELOPMENT ONLY.
#
# Services:
#   cognate-node  — AI governance REST API (future)
#   attestia-witness — XRPL witness for attestation (optional)
#
# Usage:
#   docker compose up -d
#   docker compose down

services:
  cognate-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NODE_ENV: "production"
      COGNATE_PROMPT_STORE_PATH: "/app/data/prompts"
      COGNATE_AGENT_REGISTRY_PATH: "/app/data/agents"
    volumes:
      - cognate-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  cognate-data:
    driver: local
